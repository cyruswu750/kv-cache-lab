name: CPU tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Runs of one pull request share a group, so a new push cancels its superseded run. Every other run (a push
# to main, a manual dispatch) gets its own group and is never cancelled or replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  cpu-tests:
    name: CPU test suite (Python 3.14)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.4"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CPU-only PyTorch and the test dependencies
        run: |
          python -m pip install --no-deps --index-url https://download.pytorch.org/whl/cpu torch==2.14.1+cpu
          python -m pip install -r requirements-ci.txt
          python -m pip check

      - name: Check the installed stack
        run: |
          python -c "import sys, torch, transformers; print(sys.version); print('torch', torch.__version__, 'transformers', transformers.__version__); assert torch.version.cuda is None, torch.version.cuda"

      - name: Run the CPU test suite (GPU tests deselected)
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          HF_DATASETS_OFFLINE: "1"
        run: python -m pytest -q -ra -m "not gpu"
