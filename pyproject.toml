[project]
name = "kvlab"
version = "0.0.0"
description = "Tiered prefix KV cache for Hugging Face LLM inference: pinned-host and disk tiers with verified restoration"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "gpu: needs a CUDA GPU and the pinned model weights (run with -m gpu)",
    "m0_strict: original M0 acceptance suite, criteria unchanged (known FAIL: nat_long greedy tie)",
    "m0_1: M0.1 audit regressions (resident vs restored, negative controls)",
    "m1: M1 tiered-cache GPU integration suite",
    "m3: M3 batched-restore GPU checks",
    "m4: M4-B GPU correctness gate (C0/C1-PA/C1-LRU/C2 replays; strict, no timing)",
    "m5: M5 GPU correctness gate (restore-policy paths, harness smoke session; strict, no timing)",
]
addopts = "-m 'not gpu'"
